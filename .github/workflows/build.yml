name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Upgrade pip
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        shell: pwsh
        run: |
          pip install pyinstaller
          pip install opencv-python
          pip install torch torchvision
          pip install qdrant-client
          pip install flask
          pip install pillow

      - name: Check OpenCV
        shell: pwsh
        run: |
          python -c "import cv2; print('OpenCV:', cv2.__version__)"
          python -c "import cv2; print('Camera backends:', cv2.videoio_registry.getCameraBackends())"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --onefile --noconsole --clean --name IndustrialVision --collect-all cv2 --collect-binaries cv2 --hidden-import cv2 --collect-all qdrant_client --collect-all PIL --collect-all torchvision main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/IndustrialVision.exe
